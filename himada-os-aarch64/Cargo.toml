[package]
name = "himada-os-aarch64"
version = "0.1.0"
edition = "2021"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
limine = "0.6.5"
spin = "0.9.8"
bitflags = "1.3.2"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
xmas-elf = "0.9.1"
linked_list_allocator = "0.10.5"
fdt = "0.1.5"
virtio-drivers = "0.13.0"
smoltcp = { version = "0.11.0", default-features = false, features = ["alloc", "medium-ethernet", "medium-ip", "proto-ipv4", "socket-tcp", "socket-udp", "socket-dns", "socket-dhcpv4"] }


